services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_dev}
      MYSQL_DATABASE: aviation
      MYSQL_USER: aviation
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aviation_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: aviation
      DB_PASSWORD: ${MYSQL_PASSWORD:-aviation_dev}
      DB_NAME: aviation
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  mysql_data:
